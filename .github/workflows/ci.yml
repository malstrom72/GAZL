name: ci

on:
  push:
    branches: [ main, Impala2, GAZL2, jit-compiler ]
  pull_request:
    branches: [ main, Impala2, GAZL2, jit-compiler ]

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1        # sets up cl.exe for VS 2022 x64
    - name: Build & test
      run: .\build.cmd                    # your script handles everything

  macos-clang:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build & test
      run: |
        chmod +x ./build.sh               # ensure it is executable
        ./build.sh
        
  # Named for the PLATFORM, not a compiler: the toolchain is whatever build.sh selects, which is g++ by default
  # (BuildCpp.sh) plus clang++ for the standalone fuzz driver on branches whose build.sh runs test-jit.sh. The old
  # name said gcc and reported a clang failure under it, which cost real time to attribute.
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build & test
      run: |
        chmod +x ./build.sh
        ./build.sh
